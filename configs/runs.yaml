# The training campaign (70 runs).
# 20 grid runs (5 backbones x {finetuned, memory, lora, memory_lora}, seed 0)
# + 24 MagiV2/MagiV3 memory ablations at three seeds each, and the seeds their baselines need:
#   the six TransReID ablations measure a memory worth +0.04 mAP, too small for them to
#   resolve anything, and MagiV2 and MagiV3 are where the memory works.
# + 6 TransReID ablations + 20 extra-seed runs: seeds 1 and 2 for every backbone's finetuned and
#   memory cells. Those two cells carry the headline comparison, and the claim that the memory
#   trades about a point of P1 Rank-1 for a fraction of a point of mAP sits at only 1.2 to 2.4
#   times the Rank-1 floor, which one seed cannot establish.
# gpu_mem_gb is the largest GPU memory a node must advertise (`gmemNN` feature) for the run to
# be placed there, and it is measured, not guessed: it is the smallest node class on which that
# backbone and configuration completed. scripts/train.py excludes every node below it, so a
# 384x384 MagiV3 run cannot land on an 11 GB card and run out of memory mid-training.
# Recipe values are NOT here: they live in src/recognize/recipe.py. Only per-run deviations
# appear as extra keys, and scripts/train.py turns each row into one training command.
runs:
  - name: transreid_finetuned_seed0
    backbone: transreid
    config: finetuned
    memory: false
    lora: false
    seed: 0
    priority: 1
    gpu_mem_gb: 11
    group: grid
  - name: transreid_memory_seed0
    backbone: transreid
    config: memory
    memory: true
    lora: false
    seed: 0
    priority: 2
    gpu_mem_gb: 11
    group: grid
  - name: transreid_lora_seed0
