# Seeds 1 and 2 for every LoRA-bearing cell.
# The 70-run campaign (configs/runs.yaml) gives three seeds to every finetuned and memory
# cell but only one to the two LoRA cells; without these runs they would be the one place the
# headline table rests on a single run.
# A separate manifest, so that configs/runs.yaml keeps its 70 rows;
# drive it with `python scripts/train.py --manifest configs/runs_seeds.yaml sbatch`.

runs:
- name: transreid_lora_seed1
  backbone: transreid
  config: lora
  memory: false
  lora: true
  seed: 1
  priority: 3
  gpu_mem_gb: 11
  group: extra_seeds
- name: transreid_lora_seed2
  backbone: transreid
  config: lora
  memory: false
  lora: true
  seed: 2
  priority: 3
  gpu_mem_gb: 11
  group: extra_seeds
- name: transreid_memory_lora_seed1
  backbone: transreid
  config: memory_lora
  memory: true
  lora: true
  seed: 1
  priority: 4
  gpu_mem_gb: 11
  group: extra_seeds
